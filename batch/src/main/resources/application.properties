spring.application.name=fin-legacy-batch
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=5000
spring.datasource.url=${DB_URL:jdbc:h2:file:./runtime/eft;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
eft.run.enabled=true
eft.run.jobs=all
eft.input-directory=${BATCH_INPUT_DIR:data/semana_3}
eft.output-directory=${BATCH_OUTPUT_DIR:output}
eft.workers=${BATCH_WORKERS:3}
eft.chunk-size=100
eft.partition-rows=250
eft.retry-limit=3
eft.retry-delay-ms=250
eft.restart-limit=2
eft.restart-delay-ms=1000
# Sin tasa ni periodo por defecto: se requieren para el job de intereses.
logging.level.cl.duoc.eft=INFO
