spring.application.name=auth-server
server.port=9100
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
eft.oauth.issuer=${AUTH_ISSUER:http://localhost:9100}
eft.oauth.key-file=${AUTH_KEY_FILE:runtime/auth/signing-key.json}
eft.clients.operator-secret=${OPERATOR_SECRET}
eft.clients.reader-secret=${CONSULTA_SECRET}
eft.clients.accounts-secret=${CUENTAS_INTERNAL_SECRET}
eft.clients.payments-secret=${PAGOS_INTERNAL_SECRET}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
