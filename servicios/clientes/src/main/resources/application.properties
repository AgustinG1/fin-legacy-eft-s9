spring.application.name=clientes
spring.cloud.config.enabled=${CLOUD_ENABLED:false}
spring.cloud.config.import-check.enabled=false
spring.cloud.config.username=infra
spring.cloud.config.password=${INFRA_PASSWORD:}
spring.config.import=${CONFIG_IMPORT:}
eureka.client.enabled=${CLOUD_ENABLED:false}
eft.cloud.enabled=${CLOUD_ENABLED:false}
server.port=8101
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/eft_clientes}
spring.datasource.username=${DB_USER:eft_clientes}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=always
eft.oauth.issuer=${AUTH_ISSUER:http://localhost:9100}
eft.oauth.jwks=${AUTH_JWKS:http://localhost:9100/oauth2/jwks}
eft.oauth.audience=clientes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
