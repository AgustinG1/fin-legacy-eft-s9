spring.application.name=auditoria
server.port=8104
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/eft_auditoria}
spring.datasource.username=${DB_USER:eft_auditoria}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.datasource.hikari.connection-timeout=3000
eft.oauth.issuer=${AUTH_ISSUER:http://localhost:9100}
eft.oauth.jwks=${AUTH_JWKS:http://localhost:9100/oauth2/jwks}
eft.oauth.audience=auditoria
spring.cloud.config.enabled=${CLOUD_ENABLED:false}
spring.cloud.config.import-check.enabled=false
spring.cloud.config.username=infra
spring.cloud.config.password=${INFRA_PASSWORD:}
spring.config.import=${CONFIG_IMPORT:}
eureka.client.enabled=${CLOUD_ENABLED:false}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
eft.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:kafka:9092}
spring.kafka.consumer.group-id=eft-auditoria-v1
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.admin.operation-timeout=5s
