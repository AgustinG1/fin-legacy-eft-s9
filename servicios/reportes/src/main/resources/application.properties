spring.application.name=reportes
server.port=8105
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/eft}
spring.datasource.username=${DB_USER:eft_reportes}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=never
eft.oauth.issuer=${AUTH_ISSUER:http://localhost:9100}
eft.oauth.jwks=${AUTH_JWKS:http://localhost:9100/oauth2/jwks}
eft.oauth.audience=reportes
spring.cloud.config.enabled=${CLOUD_ENABLED:false}
spring.cloud.config.import-check.enabled=false
spring.cloud.config.username=infra
spring.cloud.config.password=${INFRA_PASSWORD:}
spring.config.import=${CONFIG_IMPORT:}
eureka.client.enabled=${CLOUD_ENABLED:false}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
