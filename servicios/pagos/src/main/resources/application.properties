spring.application.name=pagos
eft.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.max.block.ms=3000
spring.cloud.config.enabled=${CLOUD_ENABLED:false}
spring.cloud.config.import-check.enabled=false
spring.cloud.config.username=infra
spring.cloud.config.password=${INFRA_PASSWORD:}
spring.config.import=${CONFIG_IMPORT:}
eureka.client.enabled=${CLOUD_ENABLED:false}
eft.cloud.enabled=${CLOUD_ENABLED:false}
server.port=8103
server.address=${SERVER_ADDRESS:127.0.0.1}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/eft_pagos}
spring.datasource.username=${DB_USER:eft_pagos}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=always
eft.oauth.issuer=${AUTH_ISSUER:http://localhost:9100}
eft.oauth.jwks=${AUTH_JWKS:http://localhost:9100/oauth2/jwks}
eft.oauth.audience=pagos
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
eft.outbound.enabled=true
spring.security.oauth2.client.registration.internal.provider=eft
spring.security.oauth2.client.registration.internal.client-id=pagos-interno
spring.security.oauth2.client.registration.internal.client-secret=${INTERNAL_SECRET}
spring.security.oauth2.client.registration.internal.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.internal.scope=ledger.write
spring.security.oauth2.client.provider.eft.token-uri=${AUTH_TOKEN_URI:http://localhost:9100/oauth2/token}
eft.dependency.url=${DEPENDENCY_URL:http://localhost:8102}
